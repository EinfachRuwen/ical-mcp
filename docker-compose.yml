version: '3.8'

services:
  ical-mcp:
    # Fertiges Image von GitHub Container Registry
    # Wird automatisch aktualisiert wenn du auf GitHub pushst
    image: ghcr.io/einfachruwen/ical-mcp:latest
    container_name: ical-mcp
    ports:
      - "8093:8093"
    environment:
      # iCloud / CalDAV Server URL
      ICAL_MCP_URL: "https://caldav.icloud.com"

      # Deine Apple-ID E-Mail-Adresse
      ICAL_MCP_USERNAME: "deine@icloud.com"

      # App-spezifisches Passwort (erzeugen unter account.apple.com)
      ICAL_MCP_PASSWORD: "xxxx-xxxx-xxxx-xxxx"

      # Zeitzone - verhindert das GMT+0 Problem in Apple Calendar
      ICAL_MCP_TIMEZONE: "Europe/Berlin"

      # Welche Kalender dürfen beschrieben werden? (* = alle, oder z.B. "Privat,Arbeit")
      ICAL_MCP_WRITABLE_CALENDARS: "*"

      # Sicherheit: Bearer Token - trag hier einen langen, zufälligen String ein!
      # Deine KI muss diesen Token beim Verbinden angeben.
      # Generieren z.B. mit: openssl rand -hex 32
      ICAL_MCP_API_KEY: "HIER_EINEN_SICHEREN_ZUFAELLIGEN_TOKEN_EINTRAGEN"
    restart: unless-stopped
