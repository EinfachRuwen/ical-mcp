version: '3.8'

services:
  ical-mcp:
    build:
      # Baut direkt aus deinem GitHub-Repo - kein git clone nötig!
      # Um auf Updates zu ziehen: docker compose build --no-cache && docker compose up -d
      context: https://github.com/EinfachRuwen/ical-mcp.git#main
      dockerfile: Dockerfile
    container_name: ical-mcp
    ports:
      - "8093:8093"
    environment:
      # iCloud / CalDAV Server URL
      ICAL_MCP_URL: "https://caldav.icloud.com"

      # Deine Apple-ID E-Mail-Adresse
      ICAL_MCP_USERNAME: "deine@icloud.com"

      # App-spezifisches Passwort (erzeugen unter account.apple.com)
      ICAL_MCP_PASSWORD: "xxxx-xxxx-xxxx-xxxx"

      # Zeitzone - verhindert das GMT+0 Problem in Apple Calendar
      ICAL_MCP_TIMEZONE: "Europe/Berlin"

      # Welche Kalender dürfen beschrieben werden? (* = alle, oder z.B. "Privat,Arbeit")
      ICAL_MCP_WRITABLE_CALENDARS: "*"
    restart: unless-stopped
